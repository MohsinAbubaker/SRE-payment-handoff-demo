serverFiles:
  alerting_rules.yml:
    groups:
      - name: payment-handoff
        rules:
          - alert: PaymentHandoffStalled
            expr: |
              handoff_pending_total > 0
              and
              handoff_oldest_pending_seconds > 120
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "Payment handoff is stalled"
server:
  persistentVolume:
    enabled: false

extraScrapeConfigs: |
  - job_name: payment-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - payment-api.sre-demo.svc.cluster.local:3000

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
